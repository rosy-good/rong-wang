<!doctype html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>融网学习平台 · UI 原型</title>
<style>
:root{--ink:#193239;--muted:#6c8085;--brand:#087e80;--line:#dce7e8;--bg:#f4f8f8;--soft:#e6f5f1;--danger:#bc4545}*{box-sizing:border-box}body{margin:0;font:14px/1.6 "Segoe UI","Microsoft YaHei",sans-serif;color:var(--ink);background:var(--bg)}button,input,select,textarea{font:inherit}button,a{touch-action:manipulation}button{cursor:pointer;border:1px solid var(--line);background:white;color:var(--ink);border-radius:8px;padding:9px 15px}button:hover{border-color:var(--brand);color:var(--brand)}button:disabled{opacity:.5;cursor:not-allowed}button.primary{background:var(--brand);color:white;border-color:var(--brand)}button.ghost{background:transparent;border-color:transparent}button.danger{color:var(--danger)}input,textarea,select{border:1px solid #bbced0;border-radius:7px;padding:10px;background:white;color:var(--ink);max-width:100%}input:not([type=radio]):not([type=checkbox]),textarea{width:100%}textarea{min-height:88px;resize:vertical}input[type=checkbox],input[type=radio]{accent-color:var(--brand);width:18px;height:18px}label.field{display:block;margin-bottom:16px}label.field>span{display:block;margin-bottom:6px;font-weight:600}button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid #e8b34b;outline-offset:3px}h1,h2,h3,p{margin:0}h1{font-size:28px;letter-spacing:-.6px}h2{font-size:20px}h3{font-size:16px}a{color:var(--brand)}small,.muted{color:var(--muted)}.shell{display:grid;grid-template-columns:224px 1fr;min-height:100vh}.sidebar{background:#123b40;color:#d8e7e7;padding:28px 20px;display:flex;flex-direction:column}.brand{display:flex;align-items:center;gap:12px;margin-bottom:38px}.logo{background:#51c6af;color:#123b40;font-size:23px;font-weight:700;border-radius:11px;width:42px;height:42px;display:grid;place-items:center}.brand b{font-size:19px;color:white}.brand small{display:block;color:#a6c6c7;font-size:11px;letter-spacing:2px}.nav{display:grid;gap:8px}.nav button{background:none;border:none;color:#bcd3d3;text-align:left;padding:12px 15px}.nav button.active{background:#28575b;color:#fff}.nav-label{font-size:11px;letter-spacing:2px;color:#89aeb0;margin-bottom:12px}.side-bottom{margin-top:auto;padding-top:40px;color:#9bbbbb;font-size:12px}.topbar{height:80px;padding:0 36px;display:flex;align-items:center;justify-content:space-between;background:white;border-bottom:1px solid var(--line);gap:16px}.avatar{display:inline-grid;place-items:center;background:var(--soft);color:var(--brand);width:34px;height:34px;border-radius:50%;margin-right:8px}.main{padding:32px 36px;max-width:1400px;margin:auto}.row{display:flex;align-items:center;gap:12px;flex-wrap:wrap}.between{justify-content:space-between}.heading{margin-bottom:26px}.heading p{margin-top:6px}.eyebrow{color:var(--brand);font-size:12px;font-weight:600;letter-spacing:1px;margin-bottom:8px}.panel{background:white;border:1px solid var(--line);border-radius:12px;padding:24px;margin-bottom:20px}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px}.grid.two{grid-template-columns:repeat(2,minmax(0,1fr))}.stat{padding:20px 24px;background:white;border:1px solid var(--line);border-radius:10px}.stat strong{font-size:32px;display:block;margin-top:8px;line-height:1.3;font-weight:600;font-variant-numeric:tabular-nums}.stat small{display:block;margin-top:6px}.stats{margin-bottom:26px}.course{padding:0;overflow:hidden}.course-top{padding:26px;background:linear-gradient(115deg,#e3f4ed,#eff8f7);border-bottom:1px solid var(--line);min-height:144px}.course-body{padding:22px}.course-icon{font-size:22px;letter-spacing:-1px;color:var(--brand);font-weight:700;margin-bottom:15px}.pill{display:inline-block;font-size:12px;padding:3px 9px;border-radius:5px;background:#edf2f3;color:#5d7276;white-space:nowrap}.pill.green{background:#e5f5ee;color:#24715d}.pill.orange{background:#fff2d7;color:#896118}.pill.red{background:#fae9e8;color:#aa4444}.notice{background:#eef7f6;border-left:3px solid #6ab8ad;padding:12px 16px;margin:16px 0;color:#35666a;border-radius:3px}.notice.warn{background:#fff7e7;border-color:#d8ad56;color:#816324}.tabs{display:flex;gap:20px;border-bottom:1px solid var(--line);margin-bottom:24px;overflow:auto}.tabs button{border:0;border-radius:0;background:transparent;padding:12px 2px;white-space:nowrap;color:var(--muted)}.tabs button.active{border-bottom:3px solid var(--brand);color:var(--brand);font-weight:600}table{width:100%;border-collapse:collapse;text-align:left}th{font-size:12px;color:var(--muted);font-weight:500;background:#f7fafa}th,td{padding:14px 12px;border-bottom:1px solid #e9efef}tr:last-child td{border-bottom:0}.tablewrap{overflow:auto}td:first-child{font-weight:500}.empty{text-align:center;padding:50px 20px}.empty h3{margin-bottom:8px}.toolbar{margin-bottom:18px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}.toolbar input{max-width:300px}.list-item{padding:18px 0;border-bottom:1px solid var(--line)}.list-item:last-child{border:0}.list-item h3{margin-bottom:5px}.questions{display:grid;gap:18px}.option{display:flex;align-items:center;gap:12px;padding:12px 14px;border:1px solid var(--line);border-radius:8px;margin-top:10px;cursor:pointer}.option:has(input:checked){background:var(--soft);border-color:#67afa3}.option input{flex:none}.question-number{font-size:13px;color:var(--brand);margin-bottom:12px}.answer-layout{display:grid;grid-template-columns:1fr 250px;gap:24px}.answer-nav{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:16px 0}.answer-nav button{border:1px solid var(--line);padding:8px;text-align:center;border-radius:7px;text-decoration:none}.answer-nav button.done{background:var(--soft)}.result-score{font-size:46px;font-weight:600;color:var(--brand);line-height:1.2}.login{min-height:100vh;display:grid;grid-template-columns:1fr 1fr;background:white}.login-art{background:#123b40;color:white;padding:9vw 7vw;display:flex;flex-direction:column;justify-content:center}.login-art h1{font-size:40px;line-height:1.4;margin:35px 0 20px}.login-art p{color:#b4d1d0;max-width:360px}.login-card{padding:60px;max-width:500px;align-self:center;width:100%;margin:auto}.login-card h2{font-size:26px;margin-bottom:8px}.login-card form{margin-top:30px}.login-card .primary{width:100%}.demo{border:1px dashed #b8cfcd;padding:14px;margin-top:25px;border-radius:8px;font-size:12px}.progress{height:7px;background:#eaf0f0;border-radius:4px;margin-top:10px;overflow:hidden}.progress span{display:block;background:#51a696;height:100%}.error{color:var(--danger);margin:10px 0}.breadcrumb{margin-bottom:20px}.breadcrumb button{padding:0}.reviewbar{background:#edf6f4;padding:8px 20px;font-size:12px;display:flex;gap:16px;justify-content:center;flex-wrap:wrap}.reviewbar button{padding:0;border:0;background:transparent;text-decoration:underline}.footer{color:var(--muted);font-size:12px;margin-top:30px}.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:#173d42;color:white;padding:12px 22px;border-radius:10px;box-shadow:0 8px 30px #123b4033;z-index:30;max-width:90%}dialog{border:0;border-radius:14px;padding:0;max-width:600px;width:calc(100% - 32px);box-shadow:0 20px 80px #123b4044}dialog::backdrop{background:#123b4077}dialog .dialog-body{padding:28px}dialog h2{margin-bottom:16px}.dialog-actions{display:flex;justify-content:flex-end;gap:12px;margin-top:24px}.checkrow{display:flex;gap:10px;align-items:flex-start;padding:12px 0}.wide{grid-column:1/-1}.subtle{background:#f7fafa}.mt{margin-top:18px}.outline{border:1px dashed var(--line);padding:18px;border-radius:9px}.num{font-variant-numeric:tabular-nums}.hero-line{border-top:1px solid #416467;margin-top:40px;padding-top:24px;display:flex;gap:30px}.hero-line strong{display:block;font-size:22px}.inline-options{display:flex;gap:16px}.cell-actions{white-space:nowrap} @media(max-width:1050px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}.main{padding:25px}.topbar{padding:0 25px}.shell{grid-template-columns:190px 1fr}.answer-layout{grid-template-columns:1fr}.answer-layout>aside{order:-1}.answer-nav{display:flex}.answer-nav button{min-width:40px}}@media(max-width:700px){.shell{display:block}.sidebar{padding:16px}.sidebar .brand{margin-bottom:16px}.nav{display:flex;overflow:auto}.nav button{white-space:nowrap}.nav-label,.side-bottom{display:none}.topbar{height:auto;min-height:65px;padding:12px 18px}.main{padding:22px 16px}.grid,.grid.two{grid-template-columns:1fr}.login{display:block}.login-art{padding:32px}.login-art h1{font-size:28px;margin:20px 0 12px}.hero-line{display:none}.login-card{padding:30px 24px}.panel{padding:18px}h1{font-size:24px}.reviewbar{justify-content:flex-start}th,td{padding:12px 8px}}
.shell>div,.main,.panel,.grid>*{min-width:0}h1,h2,h3,td,p{overflow-wrap:anywhere}dialog{max-height:calc(100dvh - 32px);overflow:auto}.dialog-actions{flex-wrap:wrap}.checkrow input[type=checkbox],.checkrow input[type=radio]{flex:none;margin-top:12px}@media(max-width:700px){.login-card .row button,.toolbar button{min-height:44px}input,select,textarea{font-size:16px}.topbar{flex-wrap:wrap}.main .heading{align-items:flex-start}.cell-actions{white-space:normal}}
.back-button{display:inline-flex;align-items:center;gap:8px;min-height:40px;padding:8px 12px;font-size:14px;background:white}.back-button:hover{background:var(--soft)}.back-button span{font-size:18px}.breadcrumb{margin:0 0 18px}@media(max-width:700px){.back-button{min-height:44px}}
</style></head><body><div id="app"></div><dialog id="modal"><div class="dialog-body" id="modal-body"></div></dialog><div id="toast" role="status" aria-live="polite" hidden></div>
<script>
'use strict';
// 仅用于 UI 评审的内存演示数据，不用于生产认证、判分或存储。
const $=s=>document.querySelector(s), esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const initialQuestions=[{id:1,type:'单选题',stem:'以下哪一种类型是 Java 的基本数据类型？',options:['String','int','Integer','ArrayList'],answer:[1],score:4,explanation:'int 是基本数据类型。String、Integer 和 ArrayList 都是引用类型。'},{id:2,type:'多选题',stem:'关于 Java 的面向对象特性，下列说法正确的是？',options:['封装能够隐藏内部实现细节','Java 支持类的多继承','继承可以复用父类的行为','多态只存在于编译阶段'],answer:[0,2],score:2,explanation:'封装、继承和多态是面向对象的主要特性。Java 类只支持单继承。'},{id:3,type:'判断题',stem:'Java 中的数组下标从 0 开始。',options:['正确','错误'],answer:[0],score:2,explanation:'长度为 n 的数组，其有效下标范围为 0 到 n−1。'}];
const copy=o=>JSON.parse(JSON.stringify(o));
let state={role:null,page:'courses',course:1,tab:'overview',task:1,answer:{},sub:null,practice:null,filter:'全部',courseFilter:'全部',search:'',historyTask:'all',expired:false};
let courses=[{id:1,name:'Java 程序设计',intro:'从基础语法到面向对象，在练习中构建扎实的编程基础。',code:'JAVA2026',joined:true},{id:2,name:'数据库原理',intro:'理解关系模型，学习 SQL 与数据库设计。',code:'MYSQL2026',joined:false}];
let bank={1:copy(initialQuestions),2:[]};
let tasks=[{id:1,course:1,title:'第一章 · Java 基础练习',desc:'完成三种客观题，巩固基本类型和面向对象知识。允许多次提交，以最高分计入课程成绩。',deadline:'2026-11-30T23:59',published:true,questions:copy(initialQuestions)},{id:2,course:1,title:'第二章 · 面向对象进阶',desc:'课程练习草稿',deadline:'2026-12-05T23:59',published:false,questions:copy(initialQuestions)}];
let submissions=[],mistakes=[],practiceHistory=[];let serial=10;
const btn=(label,action,kind='')=>`<button type="button" class="${kind}" data-action="${action}">${label}</button>`;
const pill=(text,color='')=>`<span class="pill ${color}">${text}</span>`;
const currentCourse=()=>courses.find(c=>c.id===state.course), currentTask=()=>tasks.find(t=>t.id===state.task);
const sum=qs=>Math.round(qs.reduce((s,q)=>s+Math.round(q.score*100),0))/100, mine=id=>submissions.filter(s=>s.task===id), best=id=>mine(id).sort((a,b)=>b.score-a.score||b.id-a.id)[0];
const expired=t=>state.expired||Date.now()>=new Date(t.deadline+':00+08:00').getTime();
const courseMembers=id=>{const c=courses.find(c=>c.id===id);return [...(c?.joined?[['陈同学','student',c.joinedAt||'2026-11-09']]:[]),...(id===1?[['李同学','li_demo','2026-11-09'],['王同学','wang_demo','2026-11-10']]:[])]};
const sampleAttempts=t=>t.id===1?2:0;
function metrics(t){const b=best(t.id),sample=sampleAttempts(t)>0,n=(b?1:0)+(sample?1:0),members=courseMembers(t.course),other=sample?sum(t.questions.slice(0,2)):0,correct=(b?b.answers.filter(a=>a.correct).length:0)+(sample?Math.min(2,t.questions.length):0);return{b,sample,n,members,other,correct,rate:members.length?n/members.length*100:null,average:n?((b?b.score:0)+other)/n:null,accuracy:n&&t.questions.length?correct/(n*t.questions.length)*100:null}}
function validQuestion(q){return q.stem.trim()&&q.explanation.trim()&&q.options.every(o=>String(o).trim())&&q.score>0&&q.score<=999999.99&&Math.abs(q.score*100-Math.round(q.score*100))<1e-7&&q.answer.every(i=>Number.isInteger(i)&&i>=0&&i<q.options.length)&&new Set(q.answer).size===q.answer.length&&(q.type==='多选题'?q.answer.length>=2:q.answer.length===1)}
function toast(s){$('#toast').textContent=s;$('#toast').hidden=false;clearTimeout(window.toastTimer);window.toastTimer=setTimeout(()=>$('#toast').hidden=true,4000)}
function rawOpenModal(html){$('#modal-body').innerHTML=html;$('#modal').showModal()}function rawCloseModal(){$('#modal').close()}
function heading(title,desc,action=''){return `<div class="heading row between"><div><div class="eyebrow">RONGWANG · LEARNING SPACE</div><h1>${esc(title)}</h1><p class="muted">${esc(desc)}</p></div>${action}</div>`}
function empty(title,desc,action=''){return `<div class="panel empty"><h3>${title}</h3><p class="muted">${esc(desc)}</p><div class="mt">${action}</div></div>`}

function renderView(){if(!state.role){renderLogin();return}let teacher=state.role==='teacher';let nav=teacher?[['courses','我的课程'],['tasks','练习任务'],['bank','课程题库']]:[['courses','我的课程'],['tasks','学习任务'],['history','提交记录'],['mistakes','我的错题']];$('#app').innerHTML=`<div class="reviewbar"><span>交互原型 · 虚构演示数据 · 刷新重置</span>${btn(teacher?'切换学生演示':'切换教师演示','switch')}${btn('原型说明 / P1','guide')}${btn(state.expired?'恢复未截止场景':'演示截止场景','expire')}</div><div class="shell"><aside class="sidebar"><div class="brand"><div class="logo">融</div><div><b>融网学习</b><small>LEARN · PRACTICE · GROW</small></div></div><div class="nav-label">${teacher?'教学工作台':'我的学习空间'}</div><nav class="nav">${nav.map(([p,t])=>btn(t,'nav:'+p,state.page===p?'active':'')).join('')}</nav><div class="side-bottom">让每一次练习，都有收获。<br>第二阶段 · UI 原型 V1</div></aside><div><header class="topbar"><span class="muted">${teacher?'教师工作台':'学生学习中心'} / ${esc(currentCourse()?.name||'课程')}</span><div class="row"><span><span class="avatar">${teacher?'林':'陈'}</span>${teacher?'林老师':'陈同学'}</span>${btn('退出','logout','ghost')}</div></header><main class="main">${backControl()}${pageContent()}<footer class="footer">融网学习平台 · UI 评审版本　　账号由维护者预先创建，暂无自助注册。</footer></main></div></div>`;}
function renderLogin(){$('#app').innerHTML=`<div class="login"><section class="login-art"><div class="brand"><div class="logo">融</div><div><b>融网学习</b><small>LEARN · PRACTICE · GROW</small></div></div><div class="eyebrow" style="color:#90d9c8">连接教学，让进步可见</div><h1>每一次练习，<br>都是向前的一步。</h1><p>从课堂任务到个人错题，在反馈与复习中，让知识真正成为自己的能力。</p><div class="hero-line"><div><strong>教 · 学</strong>一站式课堂协作</div><div><strong>练 · 习</strong>清晰可见的学习反馈</div></div></section><section class="login-card"><h2>欢迎回到融网</h2><p class="muted">使用平台分配的账号登录</p><form id="login-form"><label class="field"><span>账号</span><input name="account" autocomplete="username" placeholder="请输入账号" required></label><label class="field"><span>密码</span><input name="password" type="password" autocomplete="current-password" placeholder="请输入密码" required></label><div id="login-error" class="error" role="alert"></div><button class="primary" type="submit">登录学习平台 →</button></form><div class="demo"><b>原型评审入口</b><p>教师 teacher / 学生 student，演示密码 123456。<br>禁用账号 disabled 可查看失败状态。</p><div class="row mt">${btn('教师快速演示','login:teacher')}${btn('学生快速演示','login:student')}</div></div><p class="muted mt">无法登录？请联系平台维护者。</p></section></div>`;}
function pageContent(){switch(state.page){case'courses':return coursesPage();case'course':return coursePage();case'bank':return bankPage();case'tasks':return tasksPage();case'task':return taskPage();case'editor':return editorPage();case'answer':return answerPage();case'result':return resultPage();case'history':return historyPage();case'mistakes':return mistakesPage();case'mistake':return mistakePage();case'practice':return practicePage();case'stats':return statsPage();default:return empty('页面不存在','请返回课程列表',btn('返回课程','nav:courses','primary'));}}
function coursesPage(){let teacher=state.role==='teacher',list=courses.filter(c=>teacher||c.joined);return heading(teacher?'我的课程':'你好，陈同学','把知识学扎实，从今天的一次练习开始。',btn(teacher?'＋ 创建课程':'＋ 加入课程',teacher?'course-new':'join','primary'))+`<div class="grid">${list.map(c=>`<article class="panel course"><div class="course-top"><div class="row between"><span class="course-icon">${c.id===1?'JAVA / 01':'DATA / 02'}</span>${pill('进行中','green')}</div><h2>${esc(c.name)}</h2></div><div class="course-body"><p class="muted">${esc(c.intro)}</p><div class="row between mt"><small>林老师 · ${tasks.filter(t=>t.course===c.id&&(teacher||t.published)).length} 个任务</small>${btn('进入课程 →','course:'+c.id,'ghost')}</div></div></article>`).join('')}</div><div class="notice mt">${teacher?'每门课程拥有独立题库。发布任务时保留题目副本，后续修改原题不会影响已发布任务。':'提交后立即查看答案和解析；截止前可以多次练习，课程成绩取最高分。'}</div>`;}
function courseTabs(){let list=state.role==='teacher'?[['overview','课程概览'],['members','课程学生'],['questions','课程题库'],['tasks','练习任务']]:[['overview','课程概览'],['tasks','学习任务']];return `<div class="tabs">${list.map(([v,t])=>btn(t,'tab:'+v,state.tab===v?'active':'')).join('')}</div>`;}
function coursePage(){let c=currentCourse(),teacher=state.role==='teacher';let content='';if(state.tab==='questions')content=bankPage(true);else if(state.tab==='tasks')content=tasksPage(true);else if(state.tab==='members')content=`<div class="panel"><h2>课程学生</h2><p class="muted">邀请码有效即可直接加入，无需审批。</p>${table(['学生','账号','加入时间'],courseMembers(c.id))}</div>`;else content=`<div class="grid two"><section class="panel"><h2>课程介绍</h2><p class="muted mt">${esc(c.intro)}</p><div class="mt">${teacher?btn('编辑课程信息','course-edit'):pill('已加入','green')}</div></section><section class="panel"><h2>${teacher?'邀请学生加入':'开始本周学习'}</h2>${teacher?`<p class="muted mt">分享邀请码给学生，默认不自动过期。</p><div class="row between mt"><h1 class="num">${esc(c.code)}</h1>${btn('重置邀请码','reset-code')}</div>`:`<p class="muted mt">查看课程任务，完成练习并及时复习错题。</p><div class="mt">${btn('查看学习任务','tab:tasks','primary')}</div>`}</section></div>`;return heading(c.name,c.intro)+courseTabs()+content;}
function table(head,rows){return `<div class="tablewrap"><table><thead><tr>${head.map(x=>`<th>${x}</th>`).join('')}</tr></thead><tbody>${rows.map(r=>`<tr>${r.map(x=>`<td>${x}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`;}
function courseSelect(){return `<select id="course-select" aria-label="选择课程">${courses.filter(c=>state.role==='teacher'||c.joined).map(c=>`<option value="${c.id}" ${state.course===c.id?'selected':''}>${esc(c.name)}</option>`).join('')}</select>`;}
function bankPage(embedded=false){let qs=(bank[state.course]||[]).filter(q=>q.stem.includes(state.search));return (embedded?'':heading('课程题库','维护课程原题，独立管理已发布任务的题目副本。',btn('＋ 新增题目','question-new','primary')))+`<div class="toolbar">${courseSelect()}<input id="question-search" aria-label="搜索题目" placeholder="搜索题干关键词" value="${esc(state.search)}">${btn('搜索','search')}${embedded?btn('＋ 新增题目','question-new','primary'):''}</div>`+(qs.length?`<div class="panel">${table(['题目','题型','分值','操作'],qs.map(q=>[esc(q.stem),pill(q.type),q.score.toFixed(2),btn('编辑','question:'+q.id,'ghost')]))}</div>`:empty('还没有匹配的题目','新增题目后即可用于课程任务。'))+`<div class="notice">题库原题可编辑；已发布任务使用独立快照，不随题库变化。删除/停用策略待 Q8 确认。</div>`;}
function tasksPage(embedded=false){let ts=tasks.filter(t=>t.course===state.course&&(state.role==='teacher'||t.published));return (embedded?'':heading(state.role==='teacher'?'练习任务':'学习任务','一次练习，一次反馈，让学习持续发生。',state.role==='teacher'?btn('＋ 创建任务','task-new','primary'):''))+`<div class="toolbar">${courseSelect()}${embedded&&state.role==='teacher'?btn('＋ 创建任务','task-new','primary'):''}</div>`+(ts.length?`<div class="panel">${table(['任务名称','状态','截止时间','题目 / 总分','操作'],ts.map(t=>[esc(t.title),pill(!t.published?'草稿':expired(t)?'已截止':'已发布',!t.published?'orange':expired(t)?'':'green'),t.deadline.replace('T',' '),`${t.questions.length} 题 / ${sum(t.questions)} 分`,btn(t.published?'查看详情':'编辑草稿',(t.published?'task:':'edit-task:')+t.id,'ghost')]))}</div>`:empty('暂无任务',state.role==='teacher'?'创建第一个练习任务。':'教师发布后，任务会显示在这里。'));}
function questionPreview(q,i,reveal=false,record=null){return `<section class="panel" id="question-${i}"><div class="row between"><div class="question-number">第 ${i+1} 题 · ${q.type}</div>${pill(q.score.toFixed(2)+' 分')}</div><h3>${esc(q.stem)}</h3>${q.options.map((o,j)=>`<p class="mt">${q.type==='判断题'?'':String.fromCharCode(65+j)+'. '}${esc(o)}</p>`).join('')}${reveal?`<div class="notice"><b>标准答案：${answerText(q,q.answer)}</b><p>${esc(q.explanation)}</p>${record?`<p>你的答案：${answerText(q,record.selected)} · 得分 ${record.score.toFixed(2)}</p>`:''}</div>`:''}</section>`;}
function taskPage(){let t=currentTask(),teacher=state.role==='teacher',b=best(t.id);return heading(t.title,`${t.questions.length} 道题 · 总分 ${sum(t.questions)} 分`,pill(expired(t)?'已截止':'已发布','green'))+`<div class="panel"><p>${esc(t.desc)}</p><div class="row between mt"><span class="muted">截止时间：${t.deadline.replace('T',' ')}（北京时间）</span><div class="row">${teacher?btn('查看成绩统计','stats:'+t.id,'primary')+btn('复制为新任务','copy-task:'+t.id):(!expired(t)?btn(mine(t.id).length?'重新作答':'开始作答','answer:'+t.id,'primary'):'<button type="button" disabled>已截止</button>')+(b?btn('查看最高分答卷','result:'+b.id):'')}</div></div>${teacher?`<div class="notice">已发布任务完全锁定。题目、答案、分值、解析与截止时间均不可修改；发现错误请复制新任务。</div>`:`<div class="notice">${b?'当前最高分 '+b.score+' 分。':'尚未提交。'}截止前不限次数提交，取最高分；并列最高分以最后一次取得最高分的答卷统计。</div>`}</div>${t.questions.map((q,i)=>questionPreview(q,i,teacher)).join('')}`;}
function editorPage(){let t=currentTask();if(t.published)return taskPage();return heading('编辑任务草稿','发布前检查题目内容、顺序及截止时间。')+`<form id="task-form"><section class="panel"><div class="grid two"><label class="field"><span>任务名称</span><input name="title" value="${esc(t.title)}" required></label><label class="field"><span>截止时间（北京时间）</span><input name="deadline" type="datetime-local" value="${esc(t.deadline)}" required></label></div><label class="field"><span>任务说明</span><textarea name="description">${esc(t.desc)}</textarea></label><div class="row">${btn('从课程题库选题','pick-questions')}<span class="muted">${t.questions.length} 道题 · ${sum(t.questions)} 分</span></div></section><section class="panel">${t.questions.length?table(['顺序','题目','分值','操作'],t.questions.map((q,i)=>[i+1,esc(q.stem),q.score.toFixed(2),`<div class="row">${btn('↑','up:'+i,'ghost')}${btn('↓','down:'+i,'ghost')}${btn('编辑副本','snapshot:'+i,'ghost')}${btn('移除','remove:'+i,'ghost')}</div>`])):'尚未选题'}</section><div class="notice warn">发布后完全锁定，不能延期或撤回。复制任务时修改的是新草稿副本，不会修改原任务。</div><div class="row"><button type="submit">保存草稿</button>${btn('预览并发布','publish','primary')}</div></form>`;}
function answerText(q,a){return a.length?a.map(i=>q.type==='判断题'?esc(q.options[i]):String.fromCharCode(65+i)).join('、'):'未作答'}
function choices(q,index,selected=[]){return q.options.map((o,j)=>`<label class="option"><input type="${q.type==='多选题'?'checkbox':'radio'}" name="q${index}" data-q="${index}" value="${j}" ${selected.includes(j)?'checked':''}><span>${q.type==='判断题'?'':String.fromCharCode(65+j)+'. '}${esc(o)}</span></label>`).join('')}
function answerPage(){let t=currentTask();return heading(t.title,'允许漏答；提交后立即查看答案和解析。')+`<div class="answer-layout"><div>${t.questions.map((q,i)=>`<section class="panel" id="question-${i}"><div class="question-number">第 ${i+1} 题 · ${q.type} · ${q.score} 分</div><h3>${esc(q.stem)}</h3>${choices(q,i,state.answer[i]||[])}</section>`).join('')}</div><aside><div class="panel"><h3>答题进度</h3><p id="answer-progress" class="muted">已答 ${Object.values(state.answer).filter(a=>a.length).length} / ${t.questions.length}</p><div class="answer-nav">${t.questions.map((q,i)=>`<button type="button" data-action="scroll-question:${i}" data-question-link="${i}" class="${state.answer[i]?.length?'done':''}">${i+1}</button>`).join('')}</div><p class="muted">截止：${t.deadline.replace('T',' ')}</p><div class="mt">${btn('提交答卷','submit-confirm','primary')}</div></div><div class="notice warn">刷新恢复机制待确认。此原型刷新会重置全部演示数据。</div></aside></div>`;}
function resultPage(){let s=submissions.find(s=>s.id===state.sub);if(!s)return empty('暂无答卷','先完成一次任务提交。');let t=tasks.find(t=>t.id===s.task),b=best(t.id);return heading(t.title+' · 答卷结果',`第 ${mine(t.id).findIndex(x=>x.id===s.id)+1} 次提交 · ${s.time}`)+`<div class="grid stats"><div class="stat">本次得分<strong>${s.score.toFixed(2)} <small style="display:inline;font-size:14px">/ ${sum(t.questions)}</small></strong></div><div class="stat">历史最高分<strong>${b.score.toFixed(2)}</strong><small>${b.id===s.id?'本次为最高分统计代表':'最高分代表：答卷 #'+b.id}</small></div><div class="stat">答对题数<strong>${s.answers.filter(a=>a.correct).length} / ${t.questions.length}</strong></div></div><div class="row" style="margin-bottom:20px">${state.role==='student'&&!expired(t)?btn('再练一次','answer:'+t.id,'primary'):''}${btn('全部提交记录','history-task:'+t.id)}${state.role==='student'?btn('去错题本复习','nav:mistakes'):btn('返回统计','stats:'+t.id)}</div>${t.questions.map((q,i)=>questionPreview(q,i,true,s.answers[i])).join('')}`;}
function historyPage(){let list=submissions.filter(s=>s.course===state.course&&(state.historyTask==='all'||s.task===Number(state.historyTask)));return heading('提交记录','每次尝试都保留，进步有迹可循。')+`<div class="toolbar">${courseSelect()}<select id="history-task-filter" aria-label="按任务筛选提交记录"><option value="all">全部任务</option>${tasks.filter(t=>t.course===state.course&&t.published).map(t=>`<option value="${t.id}" ${String(state.historyTask)===String(t.id)?'selected':''}>${esc(t.title)}</option>`).join('')}</select></div>`+(list.length?`<div class="panel">${table(['任务','提交时间','本次得分','统计代表','操作'],list.slice().reverse().map(s=>[esc(tasks.find(t=>t.id===s.task).title),s.time,s.score.toFixed(2),best(s.task).id===s.id?pill('最高分代表','green'):'—',btn('查看答卷','result:'+s.id,'ghost')]))}</div>`:empty('还没有提交记录','完成一次任务后，在这里查看每次答卷。',btn('查看学习任务','nav:tasks','primary')));}
function mistakesPage(){let list=mistakes.filter(m=>(state.filter==='全部'||(m.mastered?'已掌握':'未掌握')===state.filter)&&(state.courseFilter==='全部'||String(m.course)===state.courseFilter));return heading('我的错题','把每一次错误，变成下一次进步的起点。')+`<div class="toolbar"><select id="mistake-course" aria-label="按课程筛选"><option value="全部">全部课程</option>${courses.filter(c=>c.joined).map(c=>`<option value="${c.id}" ${state.courseFilter===String(c.id)?'selected':''}>${esc(c.name)}</option>`).join('')}</select><select id="mastery-filter" aria-label="掌握状态">${['全部','未掌握','已掌握'].map(v=>`<option ${state.filter===v?'selected':''}>${v}</option>`).join('')}</select></div>`+(list.length?`<div class="panel">${list.map(m=>`<div class="list-item"><div class="row between"><div><div class="row">${pill(m.q.type)}${pill(m.mastered?'已掌握':'未掌握',m.mastered?'green':'orange')}</div><h3 class="mt">${esc(m.q.stem)}</h3><small>${esc(courses.find(c=>c.id===m.course).name)} · 错误 ${m.count} 次 · 最近 ${m.last}</small></div><div class="row">${btn('查看详情','mistake:'+m.id)}${btn('复练','practice:'+m.id,'primary')}</div></div></div>`).join('')}</div>`:empty('这里暂时没有错题','正式答错或漏答后，题目会自动归集到这里。',btn('去完成任务','nav:tasks','primary')));}
function mistakePage(){let m=mistakes.find(m=>m.id===state.practice);return heading('错题详情',`累计错误 ${m.count} 次 · 最近答错 ${m.last}`)+`<div class="row" style="margin-bottom:20px">${pill(m.mastered?'已掌握':'未掌握',m.mastered?'green':'orange')}${btn('开始复练','practice:'+m.id,'primary')}${btn(m.mastered?'取消掌握':'标记已掌握','master:'+m.id)}${btn('返回错题本','nav:mistakes')}</div>`+questionPreview(m.q,0,true)+`<div class="panel"><h3>复练历史</h3>${practiceHistory.filter(p=>p.mistake===m.id).length?table(['时间','答案','结果'],practiceHistory.filter(p=>p.mistake===m.id).reverse().map(p=>[p.time,answerText(m.q,p.answer),pill(p.correct?'答对 · 已掌握':'答错 · 未掌握',p.correct?'green':'orange')])):'<p class="muted mt">尚未复练。手动掌握不会删除历史或清零错误次数。</p>'}</div>`;}
function practicePage(){let m=mistakes.find(m=>m.id===state.practice);return heading('错题复练','答对自动标记已掌握；答错累计次数并恢复未掌握。')+`<div class="panel"><div class="question-number">${m.q.type} · 累计错误 ${m.count} 次</div><h3>${esc(m.q.stem)}</h3>${choices(m.q,0,state.answer[0]||[])}<div class="row mt">${btn('提交复练','practice-submit','primary')}${btn('返回详情','mistake:'+m.id)}</div></div>`;}
function statsPage(){let t=currentTask(),m=metrics(t),{b,sample,n,members,other}=m;const percent=v=>v===null?'暂无数据':v.toFixed(1)+'%';return heading(t.title+' · 学习统计','每位学生仅使用最高分代表答卷；并列取最后一次最高分。')+'<div class="grid stats"><div class="stat">提交率<strong>'+percent(m.rate)+'</strong><small>'+n+' / '+members.length+' 名当前课程成员</small></div><div class="stat">班级平均分<strong>'+(m.average===null?'暂无数据':m.average.toFixed(2))+'</strong><small>未提交学生不参与平均分</small></div><div class="stat">班级正确率<strong>'+percent(m.accuracy)+'</strong><small>正确题次 /（已提交人数 × 题目数）</small></div></div><div class="panel"><h2>学生提交情况</h2>'+table(['学生','提交次数','最高分','状态','操作'],members.map(([name,account])=>{let isMine=account==='student',submitted=isMine?!!b:account==='li_demo'&&sample;return[esc(name),isMine?mine(t.id).length:submitted?sampleAttempts(t):0,submitted?(isMine?b.score:other).toFixed(2):'未提交',pill(submitted?'已提交':'未提交',submitted?'green':'orange'),submitted?(isMine?btn('代表答卷','result:'+b.id,'ghost')+btn('全部答卷','history-task:'+t.id,'ghost'):btn('演示答卷','other-result','ghost')+btn('全部答卷','other-history','ghost')):'—']}))+(members.length?'':'<p class="muted mt">暂无课程成员。</p>')+'</div><div class="panel"><h2>逐题正确率</h2>'+t.questions.map((q,i)=>{let count=(b?.answers[i]?.correct?1:0)+(sample&&i<2?1:0),pct=n?count/n*100:null;return '<div class="list-item"><div class="row between"><span>'+(i+1)+'. '+esc(q.stem)+'</span><span class="num">'+percent(pct)+'</span></div><div class="progress"><span style="width:'+(pct??0)+'%"></span></div></div>'}).join('')+'</div><div class="notice">仅初始 Java 任务有李同学的固定示例答卷。新建和复制任务初始无提交；成员分母跟随当前课程加入状态变化，复练不参与统计。</div>';}
function courseForm(edit=false){let c=currentCourse();openModal(`<h2>${edit?'编辑课程':'创建课程'}</h2><form id="course-form" data-edit="${edit}"><label class="field"><span>课程名称</span><input name="name" required value="${edit?esc(c.name):''}"></label><label class="field"><span>课程介绍</span><textarea name="intro">${edit?esc(c.intro):''}</textarea></label><div class="dialog-actions">${btn('取消','close')}<button class="primary" type="submit">保存课程</button></div></form>`)}
function questionForm(id=null,index=null){let q=index!==null?currentTask().questions[index]:(bank[state.course]||[]).find(q=>q.id===id)||{type:'单选题',stem:'',options:['','','',''],answer:[],score:2,explanation:''};openModal(`<h2>${index!==null?'编辑任务题目副本':id?'编辑题库原题':'新增题目'}</h2><form id="question-form" data-id="${id||''}" data-index="${index===null?'':index}"><div class="grid two"><label class="field"><span>题型</span><select name="type" id="question-type">${['单选题','多选题','判断题'].map(t=>`<option ${q.type===t?'selected':''}>${t}</option>`).join('')}</select></label><label class="field"><span>分值</span><input name="score" type="number" min="0.01" max="999999.99" step="0.01" value="${q.score}" required></label></div><label class="field"><span>题干</span><textarea name="stem" required>${esc(q.stem)}</textarea></label><div id="question-options">${optionEditor(q)}</div><label class="field"><span>解析</span><textarea name="explanation" required>${esc(q.explanation)}</textarea></label><p id="question-error" class="error" role="alert"></p><div class="dialog-actions">${btn('取消','close')}<button type="submit" class="primary">保存题目</button></div></form>`)}
function optionEditor(q){return `<p class="muted">勾选标准答案。${q.type==='多选题'?'至少选择两个正确选项。':'选择一个正确答案。'}</p>`+q.options.map((v,i)=>`<div class="checkrow"><input aria-label="${String.fromCharCode(65+i)} 为正确答案" type="${q.type==='多选题'?'checkbox':'radio'}" name="correct" value="${i}" ${q.answer.includes(i)?'checked':''}><input name="option${i}" aria-label="选项 ${String.fromCharCode(65+i)}" value="${esc(v)}" ${q.type==='判断题'?'readonly':''} required></div>`).join('')}
function saveTaskForm(){let f=$('#task-form');if(!f||!f.reportValidity())return false;let t=currentTask();if(t.published){toast('已发布任务不能修改。');return false}if(!f.elements.title.value.trim()){toast('任务名称不能仅包含空格。');return false}t.title=f.elements.title.value.trim();t.desc=f.elements.description.value;t.deadline=f.elements.deadline.value;return !!t.title}
function compare(q,a){return q.answer.length===a.length&&q.answer.every(x=>a.includes(x))}
function now(){return new Date().toLocaleString('zh-CN',{hour12:false})}
function addMistake(q,course){let m=mistakes.find(m=>m.q.id===q.id&&m.course===course);if(m){m.count++;m.mastered=false;m.last=now();m.q=copy(q)}else mistakes.push({id:++serial,q:copy(q),course,count:1,mastered:false,last:now()})}
function submitTask(){let t=currentTask();closeModal();if(expired(t)){toast('任务已截止，新的提交不被接受。');return}let answers=t.questions.map((q,i)=>{let selected=state.answer[i]||[],correct=compare(q,selected);if(!correct)addMistake(q,t.course);return{selected:copy(selected),correct,score:correct?q.score:0}});let s={id:++serial,task:t.id,course:t.course,time:now(),answers,score:sum(answers)};submissions.push(s);state.answerDirty=false;checkpoint();state.sub=s.id;navigate('result');toast('演示提交成功，答案与解析已公开。')}
document.addEventListener('click',e=>{let el=e.target.closest('[data-action]');if(!el)return;e.preventDefault?.();if(!beforeAction(el.dataset.action))return;let [a,...rest]=el.dataset.action.split(':'),v=rest.join(':'),id=Number(v);switch(a){case'noop':return;case'close':closeModal();return;case'login':state.role=v;navigate('courses');return;case'logout':state.role=null;navigate('courses');return;case'switch':state.role=state.role==='teacher'?'student':'teacher';state.course=1;navigate('courses');return;case'nav':if(v==='history')state.historyTask='all';navigate(v);return;case'expire':state.expired=!state.expired;render();toast(state.expired?'已进入截止场景':'已恢复正常日期判断');return;case'guide':openModal('<h2>原型评审说明</h2><p>使用虚构数据模拟交互；刷新重置。快速角色切换仅为评审入口，不是正式产品权限切换。</p><div class="notice warn">此单文件包含演示答案与前端模拟判分，不具备生产保密、认证、服务器时间或幂等保障。正式实现必须由后端执行。</div><p>Q8 生命周期、Q12 自动保存、Q11 部署容量及账号维护/认证方案保持未决。本原型不提供相应确定功能。</p><div class="dialog-actions">'+btn('关闭','close','primary')+'</div>');return;case'course':state.course=id;state.tab='overview';navigate('course');return;case'tab':state.tab=v;navigate('course');return;case'course-new':courseForm();return;case'course-edit':courseForm(true);return;case'join':openModal('<h2>加入课程</h2><p class="muted">输入教师分享的邀请码，验证通过后直接加入。</p><form id="join-form"><label class="field mt"><span>课程邀请码</span><input name="code" required placeholder="例如 MYSQL2026"></label><p id="join-error" class="error" role="alert"></p><small>演示：JAVA2026 已加入；MYSQL2026 可加入。</small><div class="dialog-actions">'+btn('取消','close')+'<button type="submit" class="primary">加入课程</button></div></form>');return;case'reset-code':openModal('<h2>重置课程邀请码？</h2><p>旧邀请码将立即失效，已经加入的学生不受影响。</p><div class="dialog-actions">'+btn('取消','close')+btn('确认重置','reset-confirm','primary')+'</div>');return;case'reset-confirm':currentCourse().code='RW'+(++serial)+'2026';closeModal();render();toast('新邀请码已生成，旧码失效。');return;case'search':state.search=$('#question-search').value;render();return;case'question-new':questionForm();return;case'question':questionForm(id);return;case'task':state.task=id;navigate('task');return;case'edit-task':state.task=id;navigate('editor');return;case'task-new':tasks.push({id:++serial,course:state.course,title:'未命名练习任务',desc:'',deadline:'2026-12-01T23:59',published:false,questions:[]});state.task=serial;navigate('editor');return;case'copy-task':{let t=copy(tasks.find(t=>t.id===id));t.id=++serial;t.title+='（副本）';t.published=false;tasks.push(t);state.task=t.id;navigate('editor');toast('已创建独立草稿，请修改后重新发布。');return}case'pick-questions':if(!saveTaskForm())return;openModal('<h2>从本课程题库选题</h2><form id="pick-form">'+(bank[state.course]||[]).map(q=>`<label class="checkrow"><input type="checkbox" name="question" value="${q.id}" ${currentTask().questions.some(x=>x.id===q.id)?'checked':''}><span>${esc(q.stem)}<br><small>${q.type} · ${q.score} 分</small></span></label>`).join('')+'<div class="dialog-actions">'+btn('取消','close')+'<button class="primary" type="submit">确认选题</button></div></form>');return;case'up':case'down':{if(!saveTaskForm())return;let qs=currentTask().questions,j=id+(a==='up'?-1:1);if(j>=0&&j<qs.length)[qs[id],qs[j]]=[qs[j],qs[id]];render();return}case'remove':if(!saveTaskForm())return;currentTask().questions.splice(id,1);render();return;case'snapshot':if(!saveTaskForm())return;questionForm(null,id);return;case'publish':if(!saveTaskForm())return;if(!currentTask().questions.length){toast('请至少选择一道题。');return}if(sum(currentTask().questions)>999999.99||!currentTask().questions.every(validQuestion)){toast('请检查题目完整性与分值，总分不能超过 999999.99。');return}if(expired(currentTask())){toast('请设置未来的截止时间，并关闭截止演示场景。');return}openModal('<h2>确认发布任务</h2><p>发布后，全部题目内容和截止时间锁定，无法修改或撤回。</p><div class="notice">'+esc(currentTask().title)+' · '+currentTask().questions.length+' 题 · '+sum(currentTask().questions)+' 分</div>'+currentTask().questions.map((q,i)=>questionPreview(q,i,true)).join('')+'<div class="dialog-actions">'+btn('返回检查','close')+btn('确认发布','publish-confirm','primary')+'</div>');return;case'publish-confirm':if(currentTask().published||expired(currentTask())){closeModal();toast('状态已变化，请重新检查任务。');return}currentTask().published=true;currentTask().questions=copy(currentTask().questions);closeModal();navigate('task');toast('任务已发布，内容已锁定。');return;case'answer':state.task=id;state.course=currentTask().course;state.answer={};state.answerDirty=false;if(expired(currentTask())){toast('任务已截止。');return}navigate('answer');return;case'submit-confirm':{let missing=currentTask().questions.length-Object.values(state.answer).filter(x=>x.length).length;openModal('<h2>确认提交答卷</h2><p>'+(missing?'还有 '+missing+' 道题未作答。漏答计零分，并进入错题本。':'所有题目均已作答。')+'</p><p class="muted mt">提交后立即公开答案；截止前仍可重新作答，成绩取最高分。</p><div class="dialog-actions">'+btn('继续检查','close')+btn('确认提交','submit-final','primary')+'</div>');return}case'submit-final':submitTask();return;case'result':state.sub=id;state.course=submissions.find(s=>s.id===id).course;navigate('result');return;case'history-task':state.task=id;state.course=currentTask().course;state.historyTask=id;navigate('history');return;case'mistake':state.practice=id;navigate('mistake');return;case'practice':state.practice=id;state.answer={};state.answerDirty=false;navigate('practice');return;case'master':{let m=mistakes.find(m=>m.id===id);m.mastered=!m.mastered;render();toast(m.mastered?'已标记掌握，历史仍保留。':'已取消掌握。');return}case'practice-submit':{let m=mistakes.find(m=>m.id===state.practice),a=state.answer[0]||[],correct=compare(m.q,a);practiceHistory.push({mistake:m.id,answer:copy(a),correct,time:now()});if(correct)m.mastered=true;else{m.mastered=false;m.count++;m.last=now()}state.answerDirty=false;checkpoint();navigate('mistake');toast(correct?'复练答对，已自动标记掌握。':'复练答错，次数加一并恢复未掌握。');return}case'stats':state.task=id;navigate('stats');return;case'other-history':{let t=currentTask();openModal('<h2>李同学 · 全部提交记录</h2><p class="muted">初始任务的固定演示样本，共两次成功提交；并列最高分取第二次。</p>'+[1,2].map(n=>'<details class="list-item"><summary>第 '+n+' 次 · '+sum(t.questions.slice(0,2)).toFixed(2)+' 分'+(n===2?' · 统计代表':'')+'</summary>'+t.questions.map((q,i)=>'<p>'+esc(q.stem)+'<br>答案：'+(i<2?answerText(q,q.answer):'未作答')+'；得分 '+(i<2?q.score:0).toFixed(2)+'</p>').join('')+'</details>').join('')+'<div class="dialog-actions">'+btn('关闭','close')+'</div>');return}case'other-result':openModal('<h2>李同学 · 最高分代表答卷</h2><p class="muted">固定演示记录：第 2 次提交，并列最高分中的最后一次。</p>'+currentTask().questions.map((q,i)=>`<div class="list-item"><h3>${esc(q.stem)}</h3><p>得分：${i<2?q.score:0} / ${q.score}</p><p>标准答案：${answerText(q,q.answer)}</p></div>`).join('')+'<div class="dialog-actions">'+btn('关闭','close')+'</div>');return;}});
document.addEventListener('change',e=>{let el=e.target;if(el.matches('[data-q]')){state.answerDirty=true;let i=Number(el.dataset.q);state.answer[i]=Array.from(document.querySelectorAll(`input[data-q="${i}"]:checked`)).map(x=>Number(x.value));if($('#answer-progress'))$('#answer-progress').textContent=`已答 ${Object.values(state.answer).filter(a=>a.length).length} / ${currentTask().questions.length}`;let link=$(`.answer-nav [data-question-link="${i}"]`);if(link)link.classList.toggle('done',state.answer[i].length>0)}if(el.id==='course-select'){state.course=Number(el.value);state.historyTask='all';render()}if(el.id==='history-task-filter'){state.historyTask=el.value;render()}if(el.id==='mastery-filter'){state.filter=el.value;render()}if(el.id==='mistake-course'){state.courseFilter=el.value;render()}if(el.id==='question-type'){$('#question-options').innerHTML=optionEditor({type:el.value,options:el.value==='判断题'?['正确','错误']:['','','',''],answer:[]})}});
document.addEventListener('submit',e=>{e.preventDefault();let f=e.target,data=new FormData(f);switch(f.id){case'login-form':{let account=data.get('account');if(account==='disabled'){$('#login-error').textContent='该账号已禁用，请联系平台维护者。';return}if(!['teacher','student'].includes(account)||data.get('password')!=='123456'){$('#login-error').textContent='账号或密码不正确。';return}state.role=account;navigate('courses');break}case'join-form':{let c=courses.find(c=>c.code===String(data.get('code')).trim());if(!c){$('#join-error').textContent='邀请码无效，请确认是否已被教师重置。';return}let was=c.joined;c.joined=true;if(!was)c.joinedAt=now();closeModal();render();toast(was?'你已加入该课程，无需重复加入。':'加入成功，课程已显示在列表中。');break}case'course-form':{if(!String(data.get('name')||'').trim()){toast('课程名称不能仅包含空格。');return}if(f.dataset.edit==='true'){currentCourse().name=data.get('name');currentCourse().intro=data.get('intro')}else{let id=++serial;courses.push({id,name:data.get('name'),intro:data.get('intro'),code:'RW'+id+'2026',joined:false});bank[id]=[]}closeModal();render();toast('课程信息已保存。');break}case'question-form':{let type=data.get('type'),answer=data.getAll('correct').map(Number),score=Number(data.get('score'));if((type==='多选题'?answer.length<2:answer.length!==1)||!(score>0)||Math.abs(score*100-Math.round(score*100))>1e-7){$('#question-error').textContent='请设置合法标准答案和大于零、最多两位小数的分值。';return}let options=Array.from({length:type==='判断题'?2:4},(_,i)=>data.get('option'+i));let index=f.dataset.index,id=Number(f.dataset.id);let q={id:index!==''?currentTask().questions[Number(index)].id:id||++serial,type,stem:data.get('stem'),options,answer,score,explanation:data.get('explanation')};if(!validQuestion(q)){$('#question-error').textContent='题干、选项和解析不能仅包含空格，分值与标准答案必须合法。';return}if(index!=='')currentTask().questions[Number(index)]=q;else if(id)bank[state.course][bank[state.course].findIndex(x=>x.id===id)]=q;else bank[state.course].push(q);closeModal();render();toast('已保存；其他已发布任务保持不变。');break}case'pick-form':{let ids=data.getAll('question').map(Number),t=currentTask();t.questions=[...t.questions.filter(q=>ids.includes(q.id)),...ids.filter(id=>!t.questions.some(q=>q.id===id)).map(id=>copy(bank[state.course].find(q=>q.id===id)))];closeModal();render();break}case'task-form':if(saveTaskForm())toast('草稿已保存在本次演示中。');break}});

// 页面历史只在本次打开期间保存；刷新仍按原型约定重置演示数据。
const pageNames={courses:'课程列表',course:'课程详情',bank:'题库管理',tasks:'任务列表',editor:'任务编辑',task:'任务详情',answer:'在线答题',result:'答卷详情',history:'历史成绩',mistakes:'个人错题本',mistake:'错题详情',practice:'错题复练',stats:'成绩统计'};
const routePages=Object.keys(pageNames);
let navSession=String(Date.now())+Math.random(),navEntries=[],navIndex=-1,modalView=null,restoringPop=false;
const formCache=new Map();
const webHistory=window.history;
let entryRoute=parseRoute(window.location?.hash||'');
function parseRoute(hash){if(!hash.startsWith('#/'))return null;const [page,query='']=hash.slice(2).split('?');const p=new URLSearchParams(query);let result={page};for(const k of ['course','task','sub','practice'])if(p.has(k))result[k]=Number(p.get(k));if(p.has('tab'))result.tab=p.get('tab');return result;}
function routeURL(s){const p=new URLSearchParams();for(const k of ['course','task','sub','practice'])if(s[k]!=null)p.set(k,s[k]);if(s.page==='course')p.set('tab',s.tab||'overview');return '#/'+(s.role?s.page:'login')+'?'+p;}
function safeState(candidate){let s={...state,...copy(candidate)};s.role=state.role;if(!s.role){s.page='courses';return s;}
if(!routePages.includes(s.page))s.page='courses';
let c=courses.find(c=>c.id===s.course),t=tasks.find(t=>t.id===s.task);
if(['task','editor','answer','stats'].includes(s.page)){if(!t||(s.role==='student'&&!t.published))s.page='tasks';else{s.course=t.course;if(s.page==='editor'&&t.published)s.page='task';if(s.page==='answer'&&expired(t))s.page='task';}}
if(s.page==='result'){const sub=submissions.find(x=>x.id===s.sub);if(!sub)s.page=s.role==='teacher'?'stats':'history';else{s.course=sub.course;s.task=sub.task;}}
if(['mistake','practice'].includes(s.page)){const m=mistakes.find(x=>x.id===s.practice);if(!m)s.page='mistakes';else s.course=m.course;}
if(s.role==='student'&&['bank','editor','stats'].includes(s.page))s.page='courses';
if(s.role==='teacher'&&['answer','mistakes','mistake','practice'].includes(s.page))s.page='courses';
c=courses.find(c=>c.id===s.course);if(!c||(s.role==='student'&&!c.joined)){s.page='courses';s.course=courses.find(c=>s.role==='teacher'||c.joined)?.id||1;}
if(!['overview','members','questions','tasks'].includes(s.tab))s.tab='overview';
if(s.role==='student'&&['members','questions'].includes(s.tab))s.tab='overview';
if(s.page==='stats'&&!tasks.some(t=>t.id===s.task&&t.published))s.page='tasks';
return s;}
function formKey(s){return [s.role,s.page,s.course,s.task,s.sub,s.practice,s.tab].join(':');}
function readInputs(prefix){return Array.from(document.querySelectorAll(prefix+' input,'+prefix+' textarea,'+prefix+' select')).filter(el=>el.type!=='password').map((el,i)=>({i,value:el.value,checked:el.checked}));}
function restoreInputs(prefix,values=[]){const els=Array.from(document.querySelectorAll(prefix+' input,'+prefix+' textarea,'+prefix+' select')).filter(el=>el.type!=='password');for(const v of values){const el=els[v.i];if(el){el.value=v.value;if(typeof v.checked==='boolean')el.checked=v.checked;}}}
function snap(){return{state:copy(state),fields:readInputs('#app'),modal:modalView?{html:$('#modal-body').innerHTML,fields:readInputs('#modal')}:null,scroll:window.scrollY||0};}
function writeHistory(push=false){if(!webHistory)return;const data={rongwang:navSession,index:navIndex};webHistory[push?'pushState':'replaceState'](data,'',routeURL(state));}
function checkpoint(write=true){if(navIndex<0)return;navEntries[navIndex]=snap();formCache.set(formKey(state),navEntries[navIndex].fields);if(write)writeHistory();}
function dirtyAnswers(){return ['answer','practice'].includes(state.page)&&!!state.answerDirty&&Object.values(state.answer).some(a=>a.length);}
function approveLeave(){if(!dirtyAnswers())return true;if(!window.confirm('存在未提交答案。返回或离开将丢弃本次未提交内容，是否继续？'))return false;state.answer={};state.answerDirty=false;for(const el of document.querySelectorAll('#app input[data-q]'))el.checked=false;const f=navEntries[navIndex];if(f){f.state.answer={};f.state.answerDirty=false;f.fields=[];}return true;}
function fallbackState(){const s={...state};if(s.page==='course') {if(s.tab!=='overview')s.tab='overview';else s.page='courses';}
else if(s.page==='bank'){s.page='course';s.tab='overview';}
else if(s.page==='editor')s.page='tasks';
else if(s.page==='answer')s.page='task';
else if(s.page==='result')s.page=s.role==='teacher'?'stats':'task';
else if(['practice','mistake'].includes(s.page))s.page='mistakes';
else if(s.page==='stats')s.page='task';
else if(s.page==='task')s.page='tasks';
else s.page='courses';
return safeState(s);}
function routeIdentity(f){const s=f.state;return [s.role,s.page,s.course,s.task,s.sub,s.practice,s.tab,!!f.modal].join('|');}
function previousEntry(){const here=navEntries[navIndex]||snap();for(let i=navIndex-1;i>=0;i--){const f=navEntries[i];if(f.state.role!==state.role)continue;const safe=safeState(f.state);if(safe.page!==f.state.page)continue;if(routeIdentity(f)!==routeIdentity(here))return i;}return -1;}
function backLabel(){const active=navEntries[navIndex];if(active&&active.state.role===state.role&&routeIdentity(active)!==routeIdentity({state,modal:null}))return pageNames[active.state.page];const i=previousEntry();return i>=0?(navEntries[i].modal?'上一层':pageNames[navEntries[i].state.page]):pageNames[fallbackState().page];}
function backControl(){return !state.role||['courses','tasks','history','mistakes'].includes(state.page)?'':'<div class="breadcrumb">'+btn('<span aria-hidden="true">←</span> 返回'+backLabel(),'back','back-button')+'</div>';}
function paint(frame){const globalExpiry=state.expired;state=safeState(frame.state);state.expired=globalExpiry;modalView=null;rawCloseModal();renderView();restoreInputs('#app',frame.fields);if(frame.modal&&state.page===frame.state.page&&!(state.page==='editor'&&currentTask()?.published)){modalView=frame.modal.html;rawOpenModal(modalView);restoreInputs('#modal',frame.modal.fields);}window.scrollTo(0,frame.scroll||0);}
function render(){const prior=navEntries[navIndex];const fields=state.page==='editor'&&prior?.state.page==='editor'&&prior.state.task===state.task?readInputs('#app'):null;renderView();if(fields)restoreInputs('#app',fields);if(navIndex<0){navEntries=[snap()];navIndex=0;}else navEntries[navIndex]=snap();writeHistory();}
function navigate(page){const old=navEntries[navIndex];const roleChanged=old&&old.state.role!==state.role;
state.page=page;if(entryRoute&&state.role){Object.assign(state,entryRoute);entryRoute=null;}state=safeState(state);
modalView=null;rawCloseModal();const fields=formCache.get(formKey(state))||[];
if(roleChanged){navSession=String(Date.now())+Math.random();navEntries=[];navIndex=-1;}
renderView();restoreInputs('#app',fields);navEntries=navEntries.slice(0,navIndex+1);navEntries.push(snap());navIndex++;writeHistory(!roleChanged&&navIndex>0);window.scrollTo(0,0);}
function openModal(html){checkpoint();let label=html.includes('question-form')?(html.includes('编辑任务题目副本')?'任务编辑':'题库管理'):html.includes('确认发布任务')?'任务编辑':backLabel();modalView='<div class="breadcrumb">'+btn('<span aria-hidden="true">←</span> 返回'+label,'modal-back','back-button')+'</div>'+html;rawOpenModal(modalView);navEntries=navEntries.slice(0,navIndex+1);navEntries.push(snap());navIndex++;writeHistory(true);}
function closeModal(){rawCloseModal();modalView=null;checkpoint();}
function goBack(){if(!approveLeave())return;checkpoint();const previous=previousEntry();if(previous>=0){if(webHistory){webHistory.go(previous-navIndex);return;}navIndex=previous;paint(navEntries[previous]);return;}
const fallback=fallbackState();paint({state:fallback,fields:formCache.get(formKey(fallback))||[]});navEntries[navIndex]=snap();writeHistory();}
function beforeAction(action){if(action==='back'||action==='modal-back'||action==='close'){goBack();return false;}
if(action.startsWith('scroll-question:')){const index=Number(action.split(':')[1]);document.querySelector('#question-'+index)?.scrollIntoView?.({behavior:'smooth',block:'start'});return false;}
const leaving=/^(nav:|course:|task:|answer:|history-task:|mistake:|practice:|result:|stats:|login:|logout$|switch$)/.test(action);
if(leaving&&!approveLeave())return false;checkpoint();return true;}
if(window.addEventListener){
window.addEventListener('popstate',event=>{const target=event.state;if(restoringPop){restoringPop=false;return;}
if(!target||target.rongwang!==navSession||!navEntries[target.index]){if(!approveLeave()){writeHistory();return;}const requested=parseRoute(window.location.hash);paint({state:safeState(requested||{page:'courses'})});navEntries=[snap()];navIndex=0;writeHistory();return;}
const previousIndex=navIndex;checkpoint(false);if(!approveLeave()){restoringPop=true;webHistory.go(previousIndex-target.index);return;}
navIndex=target.index;paint(navEntries[navIndex]);navEntries[navIndex]=snap();writeHistory();});
window.addEventListener('beforeunload',event=>{if(dirtyAnswers()){event.preventDefault();event.returnValue='';}});
}
document.addEventListener('input',()=>checkpoint());
$('#modal').addEventListener?.('cancel',event=>{event.preventDefault();goBack();});

render();
</script></body></html>
